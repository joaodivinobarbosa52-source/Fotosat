<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--verde:#14342b;--sol:#ffd23f;--papel:#f5f3ec;--tinta:#10201a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--verde);color:var(--papel)}
#map{position:absolute;inset:0;background:#0d1f1a}
.top{position:absolute;z-index:500;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}
.chip{pointer-events:auto;background:rgba(20,52,43,.92);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#e5533d}
.dot.ok{background:#7bd88f}
.bar{position:absolute;z-index:500;left:0;right:0;bottom:0;padding:12px 16px max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,rgba(10,25,20,.75))}
.side{background:rgba(20,52,43,.92);color:var(--papel);border:0;border-radius:14px;padding:12px 14px;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-width:84px}
.cam{width:78px;height:78px;border-radius:50%;border:5px solid var(--papel);background:var(--sol);color:var(--tinta);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.cam:active{transform:scale(.94)}
.pin{width:34px;height:34px;border-radius:50%;background:var(--sol);color:var(--tinta);border:3px solid #fff;font:800 15px/28px system-ui,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.pin.novo{animation:pulso .9s ease-out 2}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(255,210,63,.9)}100%{box-shadow:0 0 0 22px rgba(255,210,63,0)}}
.eu{width:16px;height:16px;border-radius:50%;background:#3b9cff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,156,255,.3)}
#ver{position:fixed;inset:0;z-index:2000;background:rgba(6,14,11,.96);display:none;flex-direction:column}
#ver.on{display:flex}
#ver img{flex:1;min-height:0;width:100%;object-fit:contain}
#info{padding:10px 16px;font-size:14px;line-height:1.5;overflow:auto;max-height:32vh}
#info b{font-size:18px}
.acoes{display:flex;gap:8px;padding:0 16px max(16px,env(safe-area-inset-bottom))}
.acoes button{flex:1;border:0;border-radius:12px;padding:13px 6px;font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#27493f;color:var(--papel)}
.acoes .del{background:#7a2a20}
#guia{position:absolute;z-index:600;left:12px;right:12px;bottom:128px;background:rgba(20,52,43,.96);border-radius:16px;padding:12px 14px;display:none}
#guia.on{display:block}
#gtxt{font-size:17px;font-weight:700;margin-bottom:10px}
.gl{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.gl #gtxt{margin:0}
#seta{display:none;font-size:36px;line-height:1;color:var(--sol);flex:none}
.gb{display:flex;gap:8px}
.gb button{flex:1;border:0;border-radius:10px;padding:11px 6px;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#27493f;color:var(--papel)}
.gb #gmaps{background:var(--sol);color:var(--tinta)}
.pin.ok{background:#7bd88f}
.sheet{position:fixed;inset:0;z-index:2500;background:rgba(6,14,11,.7);display:none;align-items:flex-end}
.sheet.on{display:flex}
.box{background:var(--papel);color:var(--tinta);width:100%;border-radius:18px 18px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.box h3{margin:0 0 6px;font-size:19px}
.box label{display:block;font-size:13px;font-weight:700;margin-top:12px}
.box textarea{width:100%;border:2px solid #c9c5b8;border-radius:10px;padding:8px;font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin-top:4px;background:#fff;color:var(--tinta)}
.box button,.dbtn button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:8px;font:700 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--verde);color:var(--papel)}
.box .cinza{background:#d9d5c8;color:var(--tinta)}
.dbtn{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips button{width:auto;margin:0;border:2px solid var(--verde);background:#fff;color:var(--verde);border-radius:999px;padding:8px 12px;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.chips button.on{background:var(--verde);color:#fff}
.box .ck{display:flex;align-items:center;gap:10px;font-size:16px;margin-top:14px}
.ck input{width:22px;height:22px}
#aviso{position:fixed;z-index:3000;left:16px;right:16px;bottom:120px;background:var(--papel);color:var(--tinta);border-radius:12px;padding:12px 14px;font-size:14px;display:none}
#aviso.on{display:block}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="chip"><span id="n">0 fotos</span></div>
  <div class="chip"><span class="dot" id="dot"></span><span id="gps">Buscando GPS…</span></div>
</div>
<div class="bar">
  <button class="side" id="ajustar">Ver tudo</button>
  <button class="cam" id="cam" aria-label="Tirar foto">&#128247;</button>
  <button class="side" id="kml">Mais</button>
</div>
<div id="det" class="sheet"><div class="box">
  <h3 id="dtit"></h3>
  <label>Tipo do problema</label><div class="chips" id="chips"></div>
  <label>Observação do operador</label><textarea id="obs" rows="2"></textarea>
  <label>Parecer do técnico</label><textarea id="laudo" rows="2"></textarea>
  <label class="ck"><input type="checkbox" id="stt"> Verificado no local</label>
  <div class="dbtn"><button id="dpular" class="cinza">Pular</button><button id="dsalvar">Salvar</button></div>
</div></div>
<div id="menu" class="sheet"><div class="box">
  <h3>Mais opções</h3>
  <button id="kmz" style="display:none">Exportar todas para o Google Earth</button>
  <button id="gpx">Exportar para iPhone (.gpx)</button>
  <button id="gpxzip">Exportar para iPhone com fotos (.zip)</button>
  <button id="envtudo">Enviar todas as fotos de uma vez</button>
  <button id="envzip">Enviar tudo em 1 arquivo (.kmz com localização)</button>
  <button id="shapp">Compartilhar o app</button>
  <button id="mapaoff">Baixar mapa desta área (offline)</button>
  <button id="mfechar" class="cinza">Fechar</button>
</div></div>
<div id="lotes" class="sheet"><div class="box">
  <h3>Enviar todas as fotos</h3>
  <div id="ltxt" style="font-size:14px;margin-bottom:6px"></div>
  <div id="lbtns"></div>
  <button id="lfechar" class="cinza">Fechar</button>
</div></div>
<div id="guia">
  <div class="gl"><div id="seta">&#9650;</div><div id="gtxt"></div></div>
  <div class="gb"><button id="gmaps">Abrir no Google Maps</button><button id="gparar">Parar</button></div>
</div>
<input id="arq" type="file" accept="image/*" capture="environment" hidden>
<div id="ver">
  <img id="img" alt="Foto">
  <div id="info"></div>
  <div class="acoes" style="padding-bottom:8px">
    <button id="edit" style="background:#2f6f5e">Tipo, observação e verificação</button>
  </div>
  <div class="acoes" style="padding-bottom:8px">
    <button id="comp" style="background:var(--sol);color:var(--tinta)">Enviar foto</button>
    <button id="ir" style="background:var(--sol);color:var(--tinta)">Guiar até aqui</button>
  </div>
  <div class="acoes" style="padding-bottom:8px">
    <button id="earth" style="background:#2f6f5e">Abrir no Google Earth</button>
  </div>
  <div class="acoes" style="padding-bottom:8px">
    <button id="ant">&lsaquo; Anterior</button>
    <button id="prox">Próxima &rsaquo;</button>
  </div>
  <div class="acoes">
    <button id="fechar">Fechar</button>
    <button id="baixar">Baixar</button>
    <button class="del" id="excluir">Excluir</button>
  </div>
</div>
<div id="aviso"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const novoUid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,map,camada,fotos=[],pos=null,atual=null,urlAtual=null,eu=null;

/* ---------- banco local ---------- */
const abrir=()=>new Promise((ok,er)=>{const r=indexedDB.open('fotomapa',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('fotos',{keyPath:'id',autoIncrement:true});
  r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)});
const pedir=r=>new Promise((ok,er)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)});
const store=m=>db.transaction('fotos',m).objectStore('fotos');

/* ---------- avisos ---------- */
let tAviso;
function aviso(t){const a=$('#aviso');a.textContent=t;a.classList.add('on');clearTimeout(tAviso);tAviso=setTimeout(()=>a.classList.remove('on'),4500)}

/* ---------- mapa de satélite ---------- */
map=L.map('map',{zoomControl:false,attributionControl:true}).setView([-4.2,-44.8],5);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:19,maxNativeZoom:16,crossOrigin:true,attribution:'Imagens © Esri'}).addTo(map);
camada=L.layerGroup().addTo(map);

function desenhar(novoId){
  camada.clearLayers();
  fotos.forEach(f=>{
    const ic=L.divIcon({className:'',html:'<div class="pin'+(f.id===novoId?' novo':'')+(f.status==='verificado'?' ok':'')+'">'+f.n+'</div>',iconSize:[34,34],iconAnchor:[17,17]});
    L.marker([f.lat,f.lng],{icon:ic}).on('click',()=>abrirFoto(f)).addTo(camada);
  });
  $('#n').textContent=fotos.length+(fotos.length===1?' foto':' fotos')+' · '+fotos.filter(f=>f.status!=='verificado').length+' pend.';
}
async function carregar(novoId){
  fotos=await pedir(store('readonly').getAll());
  for(const f of fotos){
    let alt=false;
    if(!f.uid){f.uid=novoUid();f.status=f.status||'pendente';f.mod=f.mod||f.ts;alt=true}
    if(!f.exif){try{f.blob=await comExif(f.blob,f)}catch(e){}f.exif=1;alt=true}
    if(alt)await pedir(store('readwrite').put(f));
  }
  fotos.sort((a,b)=>a.n-b.n);
  desenhar(novoId);
}
function ajustar(){
  const p=fotos.map(f=>[f.lat,f.lng]);
  if(pos)p.push([pos.lat,pos.lng]);
  if(!p.length)return aviso('Ainda não há fotos nem sinal de GPS.');
  if(p.length===1)map.setView(p[0],17);else map.fitBounds(p,{padding:[60,60],maxZoom:17});
}

/* ---------- GPS contínuo ---------- */
let primeiro=true;
if(!navigator.geolocation){$('#gps').textContent='Sem GPS neste aparelho'}
else navigator.geolocation.watchPosition(p=>{
  pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
  $('#dot').className='dot ok';$('#gps').textContent='GPS ±'+Math.round(pos.acc)+' m';
  if(!eu)eu=L.marker([pos.lat,pos.lng],{icon:L.divIcon({className:'',html:'<div class="eu"></div>',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false,zIndexOffset:-500}).addTo(map);
  else eu.setLatLng([pos.lat,pos.lng]);
  if(primeiro&&!fotos.length){map.setView([pos.lat,pos.lng],17)}
  primeiro=false;
  atualizarGuia();
},e=>{
  $('#dot').className='dot';
  $('#gps').textContent=e.code===1?'GPS bloqueado':'Sem sinal de GPS';
  if(e.code===1)aviso('Permita o acesso à localização nas configurações do navegador.');
},{enableHighAccuracy:true,maximumAge:0,timeout:30000});

/* ---------- tirar foto ---------- */
$('#cam').onclick=()=>{
  if(!pos)return aviso('Aguarde o sinal de GPS (bolinha verde) antes de tirar a foto.');
  if(pos.acc>30&&!confirm('GPS fraco (±'+Math.round(pos.acc)+' m). Tirar a foto mesmo assim?'))return;
  window._posToque={...pos};
  $('#arq').click();
};
$('#arq').onchange=async e=>{
  const arq=e.target.files[0];e.target.value='';
  if(!arq)return;
  const p=window._posToque||pos;window._posToque=null;
  if(!p)return aviso('Sem posição de GPS. Tente de novo.');
  try{
    const ts=Date.now(),blob=await comExif(await reduzir(arq,1600),{lat:p.lat,lng:p.lng,acc:p.acc,ts});
    const n=fotos.reduce((m,f)=>Math.max(m,f.n),0)+1;
    const id=await pedir(store('readwrite').add({n,uid:novoUid(),lat:p.lat,lng:p.lng,acc:p.acc,ts,mod:ts,exif:1,status:'pendente',tipo:'',obs:'',laudo:'',blob}));
    await carregar(id);
    map.setView([p.lat,p.lng],Math.max(Math.min(map.getZoom(),17),16));
    aviso('Foto '+n+' marcada no mapa.');abrirDet(fotos.find(x=>x.id===id));
  }catch(err){aviso('Não foi possível salvar a foto. Tente de novo.')}
};
async function reduzir(arq,max){
  const bmp=await createImageBitmap(arq);
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);if(bmp.close)bmp.close();
  return new Promise((ok,er)=>c.toBlob(b=>b?ok(b):er(),'image/jpeg',.82));
}


/* ---------- GPS dentro do JPEG (EXIF) ---------- */
function exifGps(lat,lng,acc,ts){
  const p2=n=>String(n).padStart(2,'0'),d=new Date(ts);
  const dt=d.getFullYear()+':'+p2(d.getMonth()+1)+':'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())+'\0';
  const dms=v=>{v=Math.abs(v);const g=Math.floor(v),m=Math.floor((v-g)*60),s=((v-g)*60-m)*60;return[g,1,m,1,Math.round(s*10000),10000]};
  const temErr=acc>0,n=temErr?6:5,gps=58,dados=gps+2+n*12+4,total=dados+48+(temErr?8:0);
  const b=new ArrayBuffer(total),v=new DataView(b),L=true;
  v.setUint8(0,0x49);v.setUint8(1,0x49);v.setUint16(2,42,L);v.setUint32(4,8,L);
  v.setUint16(8,2,L);
  v.setUint16(10,0x0132,L);v.setUint16(12,2,L);v.setUint32(14,20,L);v.setUint32(18,38,L);
  v.setUint16(22,0x8825,L);v.setUint16(24,4,L);v.setUint32(26,1,L);v.setUint32(30,gps,L);
  for(let i=0;i<20;i++)v.setUint8(38+i,dt.charCodeAt(i));
  v.setUint16(gps,n,L);
  const ent=(i,tag,tipo,cont)=>{const o=gps+2+i*12;v.setUint16(o,tag,L);v.setUint16(o+2,tipo,L);v.setUint32(o+4,cont,L);return o+8};
  let o=ent(0,0,1,4);v.setUint8(o,2);v.setUint8(o+1,3);
  o=ent(1,1,2,2);v.setUint8(o,(lat>=0?'N':'S').charCodeAt(0));
  o=ent(2,2,5,3);v.setUint32(o,dados,L);
  o=ent(3,3,2,2);v.setUint8(o,(lng>=0?'E':'W').charCodeAt(0));
  o=ent(4,4,5,3);v.setUint32(o,dados+24,L);
  dms(lat).forEach((x,i)=>v.setUint32(dados+i*4,x,L));
  dms(lng).forEach((x,i)=>v.setUint32(dados+24+i*4,x,L));
  if(temErr){o=ent(5,0x1F,5,1);v.setUint32(o,dados+48,L);v.setUint32(dados+48,Math.round(acc*100),L);v.setUint32(dados+52,100,L)}
  return new Uint8Array(b);
}
async function comExif(blob,f){
  const ab=new Uint8Array(await blob.arrayBuffer());
  if(ab[0]!==0xFF||ab[1]!==0xD8)return blob;
  if(ab[2]===0xFF&&ab[3]===0xE1)return blob;
  const t=exifGps(f.lat,f.lng,f.acc,f.ts),len=2+6+t.length;
  const seg=new Uint8Array(4+6+t.length);
  seg[0]=0xFF;seg[1]=0xE1;seg[2]=len>>8;seg[3]=len&255;
  seg.set([0x45,0x78,0x69,0x66,0,0],4);seg.set(t,10);
  return new Blob([ab.subarray(0,2),seg,ab.subarray(2)],{type:'image/jpeg'});
}

/* ---------- guiar até a foto (funciona sem internet) ---------- */
let alvo=null,linhaGuia=null;
const PONTOS=['Norte','Nordeste','Leste','Sudeste','Sul','Sudoeste','Oeste','Noroeste'];
const rad=x=>x*Math.PI/180;
function distancia(a,b){const h=Math.sin(rad(b.lat-a.lat)/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(rad(b.lng-a.lng)/2)**2;return 12742000*Math.asin(Math.sqrt(h))}
function rumo(a,b){const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return(Math.atan2(y,x)*180/Math.PI+360)%360}
let rumoAparelho=null,bussola=null;
function atualizarSeta(){
  const s=$('#seta');
  if(!alvo||!pos||rumoAparelho==null){s.style.display='none';return}
  s.style.display='block';
  s.style.transform='rotate('+((rumo(pos,alvo)-rumoAparelho+360)%360)+'deg)';
}
function aoOrientar(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;
  else if(e.absolute&&e.alpha!=null&&e.beta!=null&&e.gamma!=null){
    const a=rad(e.alpha),b=rad(e.beta),g=rad(e.gamma);
    const rA=-Math.cos(a)*Math.sin(g)-Math.sin(a)*Math.sin(b)*Math.cos(g);
    const rB=-Math.sin(a)*Math.sin(g)+Math.cos(a)*Math.sin(b)*Math.cos(g);
    h=(Math.atan2(rA,rB)*180/Math.PI+360)%360;
  }else return;
  rumoAparelho=h;atualizarSeta();
}
async function ligarBussola(){
  if(bussola)return;
  try{
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
      if(await DeviceOrientationEvent.requestPermission()!=='granted')return;
    }
  }catch(e){return}
  bussola='ondeviceorientationabsolute' in window?'deviceorientationabsolute':'deviceorientation';
  window.addEventListener(bussola,aoOrientar,true);
}
function desligarBussola(){
  if(bussola){window.removeEventListener(bussola,aoOrientar,true);bussola=null}
  rumoAparelho=null;$('#seta').style.display='none';
}
function atualizarGuia(){atualizarGuia0();atualizarSeta()}

}

/* ---------- exportar KMZ (Google Earth, com as fotos dentro) ---------- */
const tabCrc=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=tabCrc[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(arqs,tipo){
  const enc=new TextEncoder(),partes=[],central=[];let off=0;
  for(const a of arqs){
    const nome=enc.encode(a.nome),c=crc32(a.dados),len=a.dados.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,c,true);h.setUint32(18,len,true);h.setUint32(22,len,true);h.setUint16(26,nome.length,true);
    partes.push(h.buffer,nome,a.dados);
    const d=new DataView(new ArrayBuffer(46));
    d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x0800,true);d.setUint16(14,0x21,true);
    d.setUint32(16,c,true);d.setUint32(20,len,true);d.setUint32(24,len,true);d.setUint16(28,nome.length,true);d.setUint32(42,off,true);
    central.push(d.buffer,nome);
    off+=30+nome.length+len;
  }
  const tam=central.reduce((s,x)=>s+x.byteLength,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,arqs.length,true);e.setUint16(10,arqs.length,true);e.setUint32(12,tam,true);e.setUint32(16,off,true);
  return new Blob([...partes,...central,e.buffer],{type:tipo||'application/vnd.google-earth.kmz'});
}
function salvar(blob,nome){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click()}
async function gerarKmz(lista){
  const enc=new TextEncoder(),arqs=[];
  const th={};
  for(const f of lista){
    try{th[f.uid]=await lerUrl(await reduzir(f.blob,800))}
    catch(e1){try{th[f.uid]=await lerUrl(f.blob)}catch(e2){th[f.uid]=''}}
  }
  const pm=lista.map(f=>'<Placemark><name>Foto '+f.n+'</name><LookAt><longitude>'+f.lng+'</longitude><latitude>'+f.lat+'</latitude><range>120</range></LookAt><description><![CDATA[<b>Foto '+f.n+'</b><br>'+(f.status==='verificado'?'Verificado':'Pendente')+(f.tipo?' · '+esc(f.tipo):'')+(f.obs?'<br>Operador: '+esc(f.obs):'')+(f.laudo?'<br>Técnico: '+esc(f.laudo):'')+'<br>'+dh(f.ts)+'<br>'+(th[f.uid]?'<img src="'+th[f.uid]+'" width="320">':'')+'<br><br><a href="'+linkRota(f)+'">Ir até aqui (Google Maps)</a>]]></description><Point><coordinates>'+f.lng+','+f.lat+',0</coordinates></Point></Placemark>').join('');
  const kml='<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Fotos no talhão</name>'+pm+'</Document></kml>';
  arqs.push({nome:'doc.kml',dados:enc.encode(kml)});
  for(const f of lista)arqs.push({nome:'fotos/foto-'+f.n+'.jpg',dados:new Uint8Array(await f.blob.arrayBuffer())});
  return zip(arqs);
}

const xml=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function gerarGpx(lista,comFotos){
  const pts=lista.map(f=>{
    const d=[(f.status==='verificado'?'Verificado':'Pendente')+(f.tipo?' - '+f.tipo:''),f.obs?'Operador: '+f.obs:'',f.laudo?'Tecnico: '+f.laudo:'',dh(f.ts),f.acc?'Precisao ~'+Math.round(f.acc)+' m':''].filter(Boolean).join('\n');
    return '<wpt lat="'+f.lat+'" lon="'+f.lng+'"><time>'+new Date(f.ts).toISOString()+'</time><name>Foto '+f.n+'</name><cmt>'+xml(d)+'</cmt><desc>'+xml(d)+'</desc>'
      +'<link href="'+(comFotos?'fotos/foto-'+f.n+'.jpg':xml(linkPonto(f)))+'"><text>'+(comFotos?'Foto '+f.n:'Abrir no Google Maps')+'</text></link><sym>Flag, Blue</sym></wpt>';
  }).join('');
  return '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Foto no Mapa" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>Fotos no talhão</name><time>'+new Date().toISOString()+'</time></metadata>'+pts+'</gpx>';
}
async function entregar(blob,nome,tipo,titulo){
  const arq=new File([blob],nome,{type:tipo});

let editando=null,tipoSel='';
function abrirDet(f){
  editando=f;tipoSel=f.tipo||'';
  $('#dtit').textContent='Foto '+f.n;
  $('#chips').innerHTML=TIPOS.map(t=>'<button data-t="'+t+'"'+(t===tipoSel?' class="on"':'')+'>'+t+'</button>').join('');
  $('#obs').value=f.obs||'';$('#laudo').value=f.laudo||'';$('#stt').checked=f.status==='verificado';
  $('#det').classList.add('on');
}
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;tipoSel=tipoSel===b.dataset.t?'':b.dataset.t;[...$('#chips').children].forEach(x=>x.classList.toggle('on',x.dataset.t===tipoSel))};
$('#dpular').onclick=()=>$('#det').classList.remove('on');
$('#dsalvar').onclick=async()=>{
  const f=editando;f.tipo=tipoSel;f.obs=$('#obs').value.trim();f.laudo=$('#laudo').value.trim();
  f.status=$('#stt').checked?'verificado':'pendente';f.mod=Date.now();
  await pedir(store('readwrite').put(f));
  $('#det').classList.remove('on');await carregar();
  if($('#ver').classList.contains('on'))abrirFoto(fotos.find(x=>x.id===f.id));
};
$('#edit').onclick=()=>abrirDet(atual);

/* ---------- menu ---------- */
$('#kml').onclick=()=>$('#menu').classList.add('on');
$('#mfechar').onclick=()=>$('#menu').classList.remove('on');
const lerUrl=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
/* ---------- baixar mapa da área para uso offline ---------- */
const TILE='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/';
const tx=(lng,n)=>Math.min(n-1,Math.max(0,Math.floor((lng+180)/360*n)));
const ty=(lat,n)=>{lat=Math.max(-85.0511,Math.min(85.0511,lat));const r=rad(lat);return Math.min(n-1,Math.max(0,Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)))};
$('#mapaoff').onclick=async()=>{
  $('#menu').classList.remove('on');
  if(!navigator.serviceWorker||!navigator.serviceWorker.controller)return aviso('Feche e abra o app uma vez com internet e tente de novo.');
  const b=map.getBounds().pad(0.1),z0=Math.max(10,Math.min(16,Math.round(map.getZoom()))-1),MAX=1200,fila=[];
  let zf=0;
  for(let z=z0;z<=16;z++){
    const n=2**z,x0=tx(b.getWest(),n),x1=tx(b.getEast(),n),y0=ty(b.getNorth(),n),y1=ty(b.getSouth(),n);
    if(fila.length+(x1-x0+1)*(y1-y0+1)>MAX)break;
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)fila.push(TILE+z+'/'+y+'/'+x);
    zf=z;
  }
  if(!fila.length)return aviso('Área grande demais. Aproxime o mapa da fazenda ou do talhão e tente de novo.');
  const tot=fila.length;
  if(!confirm('Baixar '+tot+' imagens (cerca de '+Math.max(1,Math.round(tot*0.03))+' MB) da área visível para usar sem internet?'))return;
  let feitos=0,falhas=0;
  const op=async()=>{
    while(fila.length){
      const u=fila.pop();
      try{const r=await fetch(u);if(r.ok)await r.blob();else falhas++}catch(e){falhas++}
      feitos++;if(feitos%10===0)aviso('Baixando mapa… '+feitos+'/'+tot);
    }
  };
  await Promise.all([1,2,3,4,5,6].map(op));
  aviso('Mapa salvo: '+(tot-falhas)+' imagens'+(falhas?' ('+falhas+' falharam)':'')+(zf<16?'. Só até o zoom '+zf+': aproxime mais para baixar o detalhe máximo.':'.'));
};
$('#ajustar').onclick=ajustar;

/* ---------- início ---------- */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
abrir().then(d=>{db=d;return carregar()}).then(()=>{if(fotos.length)ajustar()});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='atualizado')aviso('Nova versão instalada. Feche e abra o app para usar.')});
}
